[package]
name = "nestix-native-gtk4"
version = "0.1.0"
edition = "2024"

[dependencies]
cargo-packager-resource-resolver = "0.1.2"
gtk4 = { version = "0.10.1", features = ["v4_8"] }
nestix = { git = "https://github.com/wirelesseye/nestix.git" }
nestix-native-core = { path = "../nestix-native-core", features = ["taffy"] }
taffy = "0.9.2"
webkit6 = "0.5.0"
