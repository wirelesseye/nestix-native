[package]
name = "nestix-native-dom"
version = "0.1.0"
edition = "2024"

[dependencies]
js-sys = "0.3.82"
nestix = { git = "https://github.com/wirelesseye/nestix.git" }
nestix-native-core = { path = "../nestix-native-core" }
wasm-bindgen = "0.2.105"
web-sys = { version = "0.3.82", features = [
    "CssStyleDeclaration",
    "Document",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "HtmlButtonElement",
    "HtmlElement",
    "HtmlInputElement",
    "Node",
    "ResizeObserver",
    "ResizeObserverEntry",
    "Window",
] }

[dev-dependencies]
wasm-bindgen-test = "0.3.55"
