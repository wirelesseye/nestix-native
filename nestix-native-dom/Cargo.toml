[package]
name = "nestix-native-dom"
version = "0.1.0"
edition = "2024"

[dependencies]
nestix = { git = "https://github.com/wirelesseye/nestix.git" }
nestix-native-core = { path = "../nestix-native-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.82"
wasm-bindgen = "0.2.105"
web-sys = { version = "0.3.82", features = [
    "AddEventListenerOptions",
    "CssStyleDeclaration",
    "Document",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "HtmlButtonElement",
    "HtmlElement",
    "HtmlIFrameElement",
    "HtmlInputElement",
    "Node",
    "ResizeObserver",
    "ResizeObserverEntry",
    "Window",
] }

[dev-dependencies]
wasm-bindgen-test = "0.3.55"
