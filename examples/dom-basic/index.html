<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nestix Native DOM</title>
  </head>
  <body>
    <main id="app" style="display: flex;"></main>
    <script type="module">
      customElements.define(
        "demo-button",
        class extends HTMLElement {
          connectedCallback() {
            this.tabIndex = 0;
            this.style.cursor = "pointer";
            this.style.padding = "6px 10px";
            this.style.border = "1px solid #64748b";
            this.style.borderRadius = "4px";
          }
        },
      );
      import init from "./pkg/dom_basic_example.js";
      init();
    </script>
  </body>
</html>
