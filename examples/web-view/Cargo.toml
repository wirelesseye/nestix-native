[package]
name = "web-view-example"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
nestix = { git = "https://github.com/wirelesseye/nestix.git" }

[target.'cfg(target_os = "macos")'.dependencies]
env_logger = "0.11.8"
nestix-native = { path = "../../nestix-native", default-features = false, features = ["appkit"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
nestix-native = { path = "../../nestix-native", default-features = false, features = ["dom"] }
wasm-bindgen = "0.2.105"
