[package]
name = "dom-surface-example"
version = "0.1.0"
edition = "2024"

[package.metadata.packager]
resources = [{ src = "assets/web", target = "web" }]

[dependencies]
env_logger = "0.11.8"
nestix = { git = "https://github.com/wirelesseye/nestix.git" }

[target.'cfg(target_os = "macos")'.dependencies]
nestix-native = { path = "../../nestix-native", default-features = false, features = ["appkit", "dom"] }

[target.'cfg(target_os = "windows")'.dependencies]
nestix-native = { path = "../../nestix-native", default-features = false, features = ["win32", "dom"] }

[build-dependencies]
nestix-native-win32-build = { path = "../../nestix-native-win32-build" }
